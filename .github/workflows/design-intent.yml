name: Electrical design intent static check
on:
  push:
    paths:
      - 'hardware/electrical-netlist-draft.csv'
      - 'scripts/check_design_intent.py'
      - '.github/workflows/design-intent.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check electrical net assignments
        run: python scripts/check_design_intent.py
