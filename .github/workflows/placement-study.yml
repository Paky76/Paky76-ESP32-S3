name: Generate KiCad placement study
on:
  push:
    paths:
      - 'scripts/generate_placement_study.py'
      - 'scripts/check_placement_geometry.py'
      - 'scripts/export_footprint_padmap.py'
      - 'scripts/check_usb_sink_nets.py'
      - 'scripts/check_power_pad_nets.py'
      - 'scripts/check_esp_usb_pad_nets.py'
      - 'scripts/check_lcd_gpio_nets.py'
      - 'scripts/check_boot_en_nets.py'
      - 'scripts/check_routed_segments.py'
      - 'scripts/summarize_drc.py'
      - 'scripts/check_drc_shorts.py'
      - 'scripts/test_drc_short_gate.py'
      - 'scripts/check_lcd_header_nets.py'
      - 'scripts/export_assembly_draft.py'
      - '.github/workflows/placement-study.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y kicad
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
      - name: Compile-check all Python CAD scripts
        run: python3 -m compileall -q scripts
      - name: Regression-test KiCad DRC short gate
        run: python3 scripts/test_drc_short_gate.py
      - name: Generate native PCB placement study
        run: /usr/bin/python3 scripts/generate_placement_study.py
      - name: Check physical footprint envelopes
        run: /usr/bin/python3 scripts/check_placement_geometry.py
      - name: Validate USB-C physical pad net mapping
        run: /usr/bin/python3 scripts/check_usb_sink_nets.py
      - name: Validate provisional power pad nets
        run: /usr/bin/python3 scripts/check_power_pad_nets.py
      - name: Validate ESP32-S3 native USB and power pad mapping
        run: /usr/bin/python3 scripts/check_esp_usb_pad_nets.py
      - name: Validate ESP32-S3 LCD SPI pad mapping
        run: /usr/bin/python3 scripts/check_lcd_gpio_nets.py
      - name: Validate provisional ST7789 8-pin header mapping
        run: /usr/bin/python3 scripts/check_lcd_header_nets.py
      - name: Validate EN and BOOT pad nets
        run: /usr/bin/python3 scripts/check_boot_en_nets.py
      - name: Audit physical copper tracks
        run: /usr/bin/python3 scripts/check_routed_segments.py
      - name: Export provisional BOM and assembly centroids from native PCB
        run: /usr/bin/python3 scripts/export_assembly_draft.py
      - name: Export real footprint pad coordinates
        run: /usr/bin/python3 scripts/export_footprint_padmap.py
      - name: Export preliminary DRC report (advisory, expected incomplete design)
        continue-on-error: true
        run: |
          mkdir -p preview
          kicad-cli pcb drc --output preview/placement-study-drc.txt hardware/Paky76-RevA-placement-study.kicad_pcb
      - name: Summarize KiCad DRC blockers
        if: always()
        run: |
          /usr/bin/python3 scripts/summarize_drc.py preview/placement-study-drc.txt
      - name: Reject physical copper shorts detected by KiCad
        run: /usr/bin/python3 scripts/check_drc_shorts.py preview/placement-study-drc.txt
      - name: Export SVG placement preview
        run: |
          mkdir -p preview
          kicad-cli pcb export svg --mode-multi -l F.Cu,F.Silkscreen,Edge.Cuts -o preview/ hardware/Paky76-RevA-placement-study.kicad_pcb
      - name: Upload editable PCB and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paky76-placement-study-NOT-FOR-FABRICATION
          path: |
            hardware/Paky76-RevA-placement-study.kicad_pcb
            preview/
            hardware/generated-footprint-padmap.csv
          if-no-files-found: ignore

      - name: Commit generated editable KiCad PCB study to repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hardware/Paky76-RevA-placement-study.kicad_pcb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cad): refresh generated non-fabrication KiCad placement PCB [skip ci]"
            git push origin HEAD:main
          fi
