name: Generate KiCad placement study
on:
  push:
    paths:
      - 'scripts/generate_placement_study.py'
      - 'scripts/check_placement_geometry.py'
      - 'scripts/export_footprint_padmap.py'
      - 'scripts/check_usb_sink_nets.py'
      - 'scripts/check_power_pad_nets.py'
      - '.github/workflows/placement-study.yml'
  workflow_dispatch:
jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y kicad
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
      - name: Generate native PCB placement study
        run: /usr/bin/python3 scripts/generate_placement_study.py
      - name: Check physical footprint envelopes
        run: /usr/bin/python3 scripts/check_placement_geometry.py
      - name: Validate USB-C physical pad net mapping
        run: /usr/bin/python3 scripts/check_usb_sink_nets.py
      - name: Validate provisional power pad nets
        run: /usr/bin/python3 scripts/check_power_pad_nets.py
      - name: Export real footprint pad coordinates
        run: /usr/bin/python3 scripts/export_footprint_padmap.py
      - name: Export preliminary DRC report (advisory, expected incomplete design)
        continue-on-error: true
        run: |
          mkdir -p preview
          kicad-cli pcb drc --output preview/placement-study-drc.txt hardware/Paky76-RevA-placement-study.kicad_pcb
      - name: Export SVG placement preview
        run: |
          mkdir -p preview
          kicad-cli pcb export svg --mode-multi -l F.Cu,F.Silkscreen,Edge.Cuts -o preview/ hardware/Paky76-RevA-placement-study.kicad_pcb
      - name: Upload editable PCB and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paky76-placement-study-NOT-FOR-FABRICATION
          path: |
            hardware/Paky76-RevA-placement-study.kicad_pcb
            preview/
            hardware/generated-footprint-padmap.csv
          if-no-files-found: ignore
