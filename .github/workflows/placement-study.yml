name: Generate KiCad placement study
on:
  push:
    paths:
      - 'scripts/generate_placement_study.py'
      - '.github/workflows/placement-study.yml'
  workflow_dispatch:
jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y kicad
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
      - name: Generate native PCB placement study
        run: /usr/bin/python3 scripts/generate_placement_study.py
      - name: Export SVG placement preview
        run: |
          mkdir -p preview
          kicad-cli pcb export svg -l F.Cu,F.Silkscreen,Edge.Cuts -o preview/ hardware/Paky76-RevA-placement-study.kicad_pcb
      - name: Upload editable PCB and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paky76-placement-study-NOT-FOR-FABRICATION
          path: |
            hardware/Paky76-RevA-placement-study.kicad_pcb
            preview/
          if-no-files-found: ignore
