name: LCD coupon structural check
on:
  push:
    paths:
      - 'hardware/lcd-routing-test.kicad_pcb'
      - 'scripts/check_lcd_coupon.py'
      - '.github/workflows/lcd-coupon-check.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check coupon nets, pads and copper segments
        run: python scripts/check_lcd_coupon.py
